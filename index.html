// A theme picked with the menu bar toggle wins over the system's; otherwise the system decides.

<style>
:root {
  --ink: #000;
  --win: #fff;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #fff;
    --win: #000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ink: #fff;
  --win: #000;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { --bar: 28px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--win);
  color: var(--ink);
  font-family: "DotGothic16", monospace;
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--ink); color: var(--win); }
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 1px dotted var(--ink); outline-offset: 2px; }

/* Menu bar: pull-down menus on the left; GitHub, X and the light/dark toggle on the right */
.menubar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 10000;
  display: flex;
  height: var(--bar);
  padding: 0 8px;
  background: var(--win);
  border-bottom: 1px solid var(--ink);
  user-select: none;
  -webkit-user-select: none;
}
.menus { display: flex; margin: 0; padding: 0; list-style: none; }
.menus > li { position: relative; }
.title, .menubar .link {
  display: block;
  height: calc(var(--bar) - 1px);
  padding: 0 10px;
  border: 0;
  background: none;
  line-height: calc(var(--bar) - 1px);
  text-decoration: none;
  white-space: nowrap;
  cursor: default;
  -webkit-touch-callout: none;
}
.menubar .me { -webkit-text-stroke: 0.5px currentColor; }
.title[aria-expanded="true"], .menubar .link:active { background: var(--ink); color: var(--win); }
.title:focus-visible, .menubar .link:focus-visible { outline-offset: -4px; }
.title[aria-expanded="true"]:focus-visible { outline-color: var(--win); }
.extras { display: flex; margin-left: auto; }
.theme {
  display: grid;
  place-items: center;
  width: 36px;
  height: calc(var(--bar) - 1px);
  padding: 0;
  border: 0;
  background: none;
  cursor: default;
}
.theme svg { display: block; width: 13px; height: 13px; shape-rendering: crispEdges; }
.theme:focus-visible, .theme:active { background: var(--ink); color: var(--win); outline: none; }
/* A menu hangs from its title, its top edge on the bar's bottom line. */
.menu {
  position: absolute;
  top: 100%;
  left: 0;
  z-index: 1;
  margin: 0;
  padding: 0;
  list-style: none;
  background: var(--win);
  border: 1px solid var(--ink);
  box-shadow: 1px 1px 0 var(--ink);
  white-space: nowrap;
}
.menu a {
  display: flex;
  justify-content: space-between;
  gap: 32px;
  padding: 0 16px;
  line-height: 22px;
  text-decoration: none;
  cursor: default;
  -webkit-touch-callout: none;
}
.menu a.on { background: var(--ink); color: var(--win); }
.menu a:focus-visible { outline: none; }   /* the highlight shows where the keys are */
.menu [role="separator"] { height: 9px; background: repeating-linear-gradient(to right, var(--ink) 0 1px, transparent 1px 2px) 0 4px / 100% 1px no-repeat; }
.menushield { position: fixed; inset: 0; z-index: 9998; }   /* takes the click that closes a menu */

/* Desktop and icons */
.desk { position: fixed; inset: var(--bar) 0 0 0; overflow: clip; background: var(--win); }   /* clip, so focus never scrolls the desk */
.picture {
  position: absolute;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  pointer-events: none;
}
.icons {
  position: relative;
  display: flex;
  flex-direction: column;
  flex-wrap: wrap-reverse;
  align-content: flex-start;
  gap: 4px 8px;
  height: 100%;
  margin: 0;
  padding: 16px 12px 44px;
  list-style: none;
}
.icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 104px;
  height: 118px;
  padding: 4px 0;
  border: 0;
  background: none;
  cursor: default;
  touch-action: manipulation;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .icon canvas:not(.color) { filter: invert(1); }
}
:root[data-theme="dark"] .icon canvas:not(.color) { filter: invert(1); }
.icon canvas {
  display: block;
  width: 64px;
  height: 64px;
  image-rendering: pixelated;
}
.icon .label {
  max-width: 100%;
  margin-top: 4px;
  padding: 0 4px;
  background: var(--win);
  font-size: 14px;
  line-height: 18px;
  text-align: center;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.icon.selected .label { background: var(--ink); color: var(--win); }


/* Windows */
.window {
  position: absolute;
  display: flex;
  flex-direction: column;
  width: min(560px, calc(100vw - 24px));
  max-height: calc(100% - 24px);
  background: var(--win);
  border: 1px solid var(--ink);
  box-shadow: 2px 2px 0 var(--ink);
}
.titlebar {
  position: relative;
  display: flex;
  justify-content: center;
  flex: none;
  height: 22px;
  padding: 4px 3px;
  border-bottom: 1px solid var(--ink);
  font-size: 16px;
  line-height: 13px;
  cursor: grab;
  touch-action: none;
  user-select: none;
}
.window.front .titlebar { background: repeating-linear-gradient(to bottom, var(--ink) 0 1px, var(--win) 1px 2px) content-box; }
.titlebar h2 { margin: 0; padding: 0 8px; background: var(--win); font-size: inherit; font-weight: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.close {
  position: absolute;
  left: 8px;
  top: 4px;
  width: 15px;
  height: 13px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--win);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--win);
  cursor: default;
}
.close::after { content: ""; position: absolute; inset: -5px -8px; }
.close svg { display: block; width: 7px; height: 7px; margin: auto; shape-rendering: crispEdges; }
.close .burst, .close:active .x { display: none; }
.close:active .burst { display: block; }
.window:not(.front) .close { visibility: hidden; }
.content { overflow: auto; padding: 14px 20px 20px; overscroll-behavior: contain; }
.window:focus, .content:focus { outline: none; }   /* the striped title bar marks the active window */
.content p { margin: 0 0 14px; }
.content > :last-child { margin-bottom: 0; }

/* Project index in the Read Me */
.index { margin: 18px 0 0; padding: 0; list-style: none; border: 1px solid var(--ink); }
.index li + li { border-top: 1px solid var(--ink); }
.index button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 14px;
  width: 100%;
  padding: 5px 10px 6px;
  border: 0;
  background: none;
  text-align: left;
  cursor: default;
}
.index .blurb, .index .year { opacity: 0.55; }
.index .blurb { grid-column: 1 / -1; }
.index button:active { background: var(--ink); color: var(--win); }

/* Get Info and tweets */
.info {
  display: grid;
  grid-template-columns: max-content 1fr;
  gap: 2px 14px;
  margin: 18px 0 0;
  padding: 10px 12px;
  border: 1px solid var(--ink);
}
.info dt { text-align: right; opacity: 0.55; }
.info dd { margin: 0; }
.tweets { margin: 18px 0 0; padding: 0; list-style: none; }
.tweets li { display: grid; grid-template-columns: 7.5em 1fr; gap: 12px; }
.tweets .date { opacity: 0.55; }
@media (hover: hover) {
  .menubar .link:hover, .theme:hover, .index button:hover { background: var(--ink); color: var(--win); }
  .tweets a:hover, .content p a:hover { background: var(--ink); color: var(--win); text-decoration: none; }
}

/* Push buttons */
.buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
.btn {
  display: inline-block;
  min-width: 88px;
  padding: 2px 14px;
  border: 1px solid var(--ink);
  border-radius: 7px;
  box-shadow: 0 0 0 1px var(--ink) inset;
  background: var(--win);
  text-align: center;
  text-decoration: none;
}
.btn:active { background: var(--ink); color: var(--win); }
.btn svg { width: 14px; height: 14px; margin-right: 7px; vertical-align: -2px; fill: currentColor; }
.btn .flap { stroke: var(--win); }
.btn:active .flap { stroke: var(--ink); }

/* Scores */
.scores { margin: 4px 0 0; padding: 0; list-style: none; }
.scores li { display: grid; grid-template-columns: 190px 1fr 40px; gap: 12px; align-items: center; }
.scores .effort { opacity: 0.55; }
.scores .bar { display: block; height: 12px; border: 1px solid var(--ink); }
.scores .bar span { display: block; height: 100%; background: var(--ink); }
.scores .n { text-align: right; }
.content .updated { margin-top: 12px; }
.content .updated span { opacity: 0.55; }

/* Image composite, and the window it opens */
.composite {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: 100%;
  margin: 4px 0 14px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--ink);
  gap: 1px;
  cursor: zoom-in;
}
.composite img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #fff; }
.composite:active { filter: invert(1); }
.window.wide { width: min(880px, calc(100vw - 24px)); }
.pictures { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pictures figure { margin: 0; }
.pictures figure:first-child { grid-column: 1 / -1; }
.pictures img { display: block; width: 100%; height: auto; border: 1px solid var(--ink); }
.pictures figcaption { margin-top: 4px; opacity: 0.55; }

/* Movie player */
.player { margin: 4px 0 14px; border: 1px solid var(--ink); }
.player video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.controls { display: flex; align-items: center; gap: 8px; height: 22px; padding: 0 6px 0 0; border-top: 1px solid var(--ink); }
.play, .step { display: grid; place-items: center; flex: none; width: 28px; height: 21px; padding: 0; border: 0; border-right: 1px solid var(--ink); background: var(--win); cursor: default; }
.play:active, .step:active { background: var(--ink); color: var(--win); }
.play svg, .step svg { display: block; width: 10px; height: 10px; shape-rendering: crispEdges; }
.controls .step { margin-left: -8px; }   /* step buttons sit flush against play */
.frame { flex: none; white-space: nowrap; }
.frame .n { display: inline-block; text-align: right; }
.play .i-play { display: none; }
.player.paused .i-play { display: block; }
.player.paused .i-pause { display: none; }
.track { display: flex; align-items: center; flex: 1; align-self: stretch; touch-action: none; cursor: default; }
.scrub { flex: 1; height: 10px; border: 1px solid var(--ink); pointer-events: none; }
.scrub span { display: block; width: 0; height: 100%; background: var(--ink); }
.player video { cursor: default; }

/* Run viewer: a car's path from above, drawn a tick at a time */
.run { margin: 4px 0 14px; border: 1px solid var(--ink); }
.run .map { aspect-ratio: 16 / 9; }
.run canvas { display: block; margin: 0 auto; image-rendering: pixelated; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .run canvas { filter: invert(1); }
}
:root[data-theme="dark"] .run canvas { filter: invert(1); }
.run.paused .i-play { display: block; }
.run.paused .i-pause { display: none; }
.run .controls { gap: 0; }
.run .clock { flex: 1; padding-left: 8px; white-space: nowrap; }
.run .tick { white-space: nowrap; }
.run .tick .n { display: inline-block; text-align: right; }
.run + p { margin-top: -6px; }
/* About This Picture: a copy of the desk with the same dots */
.window:where([data-id="picture"]) { width: min(400px, calc(100vw - 24px)); }
.copy { display: block; box-sizing: content-box; margin: 4px auto 14px; border: 1px solid var(--ink); image-rendering: pixelated; }

/* Zoom rectangles */
.zoomrect { position: fixed; z-index: 9999; border: 1px solid var(--ink); pointer-events: none; }
.shield { position: absolute; }

@media (max-width: 600px), (max-height: 500px) {
  .menubar { padding: 0; }
  .title, .menubar .link { padding: 0 7px; }
  /* Menus drop full width under the bar. */
  .menu { position: fixed; top: calc(var(--bar) - 1px); right: 0; max-height: calc(100% - var(--bar) + 1px); overflow-y: auto; border-width: 1px 0; box-shadow: 0 1px 0 var(--ink); }
  .icons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    align-content: start;
    gap: 12px 0;
    height: 100%;
    overflow-y: auto;
    padding: 16px 4px;
  }
  .icon { width: auto; min-width: 0; }
  .window, .window.wide { inset: 0 !important; width: auto; max-height: none !important; box-shadow: none; border-width: 0; }
  .titlebar { height: 28px; padding: 6px 3px; cursor: default; }
  .close { top: 6px; width: 17px; height: 15px; }
  .content { flex: 1; padding: 12px max(14px, calc((100% - 640px) / 2)) 20px; }
  .scores li { grid-template-columns: 1fr 40px; gap: 0 12px; margin-bottom: 6px; }
  .scores .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 480px) {
  .frame .word { display: none; }   /* "213 of 375", so the seek bar keeps its room */
}
@media (max-width: 360px) {
  .menubar { font-size: 15px; }
  .title, .menubar .link { padding: 0 5px; }
  .theme { width: 32px; }
}
/* No room for GitHub on the bar; it is in the Adi Singh menu. */
@media (max-width: 359px) {
  .menubar .wide { display: none; }
}
/* Fingers need bigger targets than a mouse. */
@media (pointer: coarse) {
  html { --bar: 34px; }
  .close::after { inset: -10px -12px; }
  .tweets li { padding: 4px 0; }
  .menubar .link { min-width: 36px; text-align: center; }
  .menu a { line-height: 44px; }
  .menu [role="separator"] { height: 13px; background-position-y: 6px; }
  .controls { height: 34px; }
  .play, .step { width: 44px; height: 33px; }
}

/* Print: only the plain sheet that printSheet() builds, black on white. */
.print { display: none; }
@media print {
  @page { margin: 14mm 16mm; }
  html, body { height: auto; overflow: visible; background: #fff; color: #000; }
  body > * { display: none !important; }
  body > .print { display: block !important; }
  .print { font-family: Georgia, "Times New Roman", serif; font-size: 9.5pt; line-height: 1.35; }
  .print h1 { margin: 0 0 6pt; font-size: 20pt; font-weight: normal; line-height: 1.2; }
  .print h2 { display: flex; justify-content: space-between; margin: 0; font-size: 13pt; line-height: 1.3; }
  .print section { margin-top: 12pt; padding-top: 6pt; border-top: 1pt solid #000; break-inside: avoid; }
  .print p { margin: 0 0 5pt; }
  .print .blurb { font-style: italic; }
  .print dl { display: grid; grid-template-columns: 9em 1fr; gap: 0 10pt; margin: 5pt 0 0; }
  .print dt { font-weight: bold; }
  .print dd { margin: 0; }
  .print ul { margin: 5pt 0 0; padding: 0; list-style: none; }
  .print li { display: grid; grid-template-columns: 6.5em 1fr auto; gap: 0 10pt; }
  .print a { color: #000; text-decoration: none; overflow-wrap: anywhere; }
}
/* Short screens: 40px still, so the longest menu fits a 320px-tall phone held sideways. */
@media (pointer: coarse) and (max-height: 500px) {
  .menu a { line-height: 40px; }
}
</style>
</head>

<nav class="menubar" id="menubar" aria-label="Menu bar"></nav>
<main class="desk" id="desk">
  <ul class="icons" id="icons"></ul>
</main>

<script>
const desk = document.getElementById("desk");
const iconList = document.getElementById("icons");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const phone = matchMedia("(max-width: 600px), (max-height: 500px)");
const PX = 32; // icon art is drawn at 32x32 and shown at 64x64

const readme = { id: "readme", name: "Read Me", body: SITE.intro, index: PROJECTS, links: SITE.contact, art: "doc" };
const items = [readme, ...PROJECTS];
const byId = new Map(items.map(p => [p.id, p]));
// A project's images open in a window of their own, which belongs to the project's window.
for (const p of PROJECTS) if (p.images) byId.set(p.id + "-images", { id: p.id + "-images", name: p.name + " images", pictures: p.images, links: [], wide: true, parent: p.id });
const icons = new Map();
const windows = new Map();
let z = 1;
let cascade = 0;

const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};

const ext = (props) => el("a", { target: "_blank", rel: "noopener", ...props });
const attrs = (n, a) => { for (const k in a) n.setAttribute(k, a[k]); return n; };
const glyphs = {
  mail: '<svg viewBox="0 0 14 14"><rect y="2" width="14" height="10"/><path class="flap" d="M1 3.5l6 4.5 6-4.5" fill="none" stroke-width="1.4"/></svg>',
  x: '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>',
};

/* Menu bar. A mouse works it like the Mac's: press a title and the menu drops, drag to an item
   and let go to choose it. Letting go on the title leaves the menu open to click an item in, and
   while one is open, pointing at another title opens that one. The chosen item blinks three
   times before it acts. Touch opens and chooses with taps; keys follow the ARIA menubar pattern. */
const menubar = document.getElementById("menubar");
const sep = { sep: true };
const closeFront = () => { const w = frontmost(); if (w) close(w.dataset.id); };
// An item is { label, act } or { label, href }; key is the key shown for it, and an item or
// separator with when() is left out of the menu whenever when() is false.
const MENUS = [
  { title: SITE.name, className: "me", items: [
    { label: "Read Me", act: () => open("readme") },
    sep,
    ...SITE.contact.map(l => ({ label: l.menu || l.label, href: l.href })),
    sep,
    ...SITE.links.map(l => ({ label: l.label, href: l.href })),
  ] },
  { title: "Projects", items: [
    ...PROJECTS.map(p => ({ label: p.name, act: () => open(p.id) })),
    { sep: true, when: () => windows.size },
    { label: "Close Window", key: "Esc", act: closeFront, when: () => windows.size },
  ] },
  { title: "Desktop", items: [
    { label: "Next Picture", act: () => nextPicture() },
    { label: "About This Picture…", act: () => open("picture") },
  ] },
];
const menuList = attrs(el("ul", { className: "menus" }), { role: "menubar", "aria-label": "Menus" });
const titles = MENUS.map((def, n) => {
  const t = attrs(el("button", { type: "button", className: "title " + (def.className || ""), textContent: def.title, id: "menu-" + n, tabIndex: n ? -1 : 0 }), { role: "menuitem", "aria-haspopup": "menu", "aria-expanded": "false" });
  const m = attrs(el("ul", { className: "menu", hidden: true }), { role: "menu", "aria-labelledby": t.id });
  for (const it of def.items) {
    const li = it.sep ? attrs(el("li"), { role: "separator" }) : attrs(el("li", {}, menuItem(it)), { role: "none" });
    li.when = it.when;
    m.append(li);
  }
  t.menu = m;
  menuList.append(attrs(el("li", {}, [t, m]), { role: "none" }));
  return t;
});
function menuItem(it) {
  const a = attrs(el("a", { tabIndex: -1 }, [el("span", { textContent: it.label })]), { role: "menuitem" });
  if (it.key) a.append(attrs(el("span", { className: "key", textContent: it.key }), { "aria-hidden": "true" }));
  if (it.key) a.setAttribute("aria-keyshortcuts", it.key === "Esc" ? "Escape" : it.key);
  // A link item is a real link, so it can be middle-clicked or copied; choosing it clicks it.
  if (it.href) Object.assign(a, { href: it.href }, it.href.startsWith("mailto:") ? {} : { target: "_blank", rel: "noopener" });
  a.act = it.act || (() => a.click());
  return a;
}
const shield = el("div", { className: "menushield", hidden: true });
document.body.append(shield);

  let to;
  if (e.key.length === 1 && e.key !== " ") {
    typed = (e.timeStamp - typedAt < 1000 ? typed : "") + e.key.toLowerCase();
    typedAt = e.timeStamp;
    const byName = [...icons.values()].sort((a, b) => iconName(a) < iconName(b) ? -1 : 1);
    to = byName.find(b => iconName(b) >= typed) || byName.at(-1);
  } else if (e.key.startsWith("Arrow")) {
    to = sel ? nearest(sel, e.key) || sel : icons.get("readme");
  } else if (e.key === "Enter" && sel && document.activeElement === document.body) {
    e.preventDefault();
    return open(sel.dataset.id, sel);
  } else return;
  e.preventDefault();
  select(to.dataset.id);
  to.focus();
});
// The nearest icon in an arrow's direction, counting sideways distance double.
function nearest(from, key) {
  const [dx, dy] = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[key];
  const centre = b => { const r = b.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const [fx, fy] = centre(from);
  let best = null, score = Infinity;
  for (const b of icons.values()) {
    const [x, y] = centre(b);
    const along = (x - fx) * dx + (y - fy) * dy, across = Math.abs(dx ? y - fy : x - fx);
    if (along > 1 && along + 2 * across < score) { best = b; score = along + 2 * across; }
  }
  return best;
}

// Every visit starts with the Read Me open; a window named in the URL opens on top of it.
// A reload keeps its place in history and adds no entry.
const start = location.hash.slice(1);
if (history.state) here = history.state.n;
else history.replaceState({ n: 0, id: "readme" }, "");
open("readme", null, here);
open(start, null, here || undefined);
</script>
