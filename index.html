@font-face { font-family: "Ark Pixel 12 Bold"; src: url("fonts/ArkPixel12-Smear.woff2") format("woff2"); font-display: block; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #fff;
    --win: #000;
    --invert: invert(1);
    color-scheme: dark;
    --btn: var(--btn-d);
    --btn-on: var(--btn-on-d);
    --sb-up: var(--sb-up-d);
    --sb-up-on: var(--sb-up-on-d);
    --sb-down: var(--sb-down-d);
    --sb-down-on: var(--sb-down-on-d);
  }
}
:root[data-theme="dark"] {
  --ink: #fff;
  --win: #000;
  --invert: invert(1);
  color-scheme: dark;
  --btn: var(--btn-d);
  --btn-on: var(--btn-on-d);
  --sb-up: var(--sb-up-d);
  --sb-up-on: var(--sb-up-on-d);
  --sb-down: var(--sb-down-d);
  --sb-down-on: var(--sb-down-on-d);
}

* { box-sizing: border-box; }
html { --bar: 24px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; cursor: default; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--win);
  color: var(--ink);
  font-family: "Ark Pixel 16", monospace;
  font-size: 16px;
  line-height: 24px;
  word-spacing: -2px;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--ink); color: var(--win); }
button { font: inherit; color: inherit; word-spacing: inherit; cursor: inherit; }
a { color: inherit; cursor: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
/* Nothing reacts to hover. Things invert while pressed, and keyboard focus inverts them too. */
:focus-visible { outline: none; }

/* Menu bar: pull-down menus on the left; GitHub, the light/dark toggle and X on the right */
.menubar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 10000;
  display: flex;
  height: var(--bar);
  padding: 0 8px;
  background: var(--win);
  border-bottom: 1px solid var(--ink);
  user-select: none;
  -webkit-user-select: none;
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
}
.menus { display: flex; margin: 0; padding: 0; list-style: none; }
.menus > li { position: relative; }
.title, .menubar .link {
  display: block;
  height: calc(var(--bar) - 1px);
  padding: 0 8px 1px;   /* the text on the top 22px, in a button as in a link */
  border: 0;
  background: none;
  line-height: calc(var(--bar) - 2px);
  text-decoration: none;
  white-space: nowrap;
  -webkit-touch-callout: none;
}
/* An open menu's title is inverted, and so is anything pressed or focused from the keyboard. */
.menubar span { position: relative; }
.title[aria-expanded="true"], .title:focus-visible, .menubar .link:active, .menubar .link:focus-visible { background: var(--ink); color: var(--win); }
.extras { display: flex; margin-left: auto; }
.theme {
  display: grid;
  place-items: center;
  width: 36px;
  height: calc(var(--bar) - 1px);
  padding: 0;
  border: 0;
  background: none;
}
.theme svg { display: block; width: 13px; height: 13px; shape-rendering: crispEdges; }
.theme:active, .theme:focus-visible { background: var(--ink); color: var(--win); }
/* A menu hangs from its title, its top edge on the bar's bottom line. Items invert while the
   pointer or the keys are on them. A separator is a row of the 50% pattern. */
.menu {
  position: absolute;
  top: 100%;
  left: 0;
  z-index: 1;
  margin: 0;
  padding: 0;
  list-style: none;
  background: var(--win);
  border: 1px solid var(--ink);
  box-shadow: 1px 1px 0 var(--ink);
  white-space: nowrap;
}
.menu a {
  display: flex;
  justify-content: space-between;
  gap: 32px;
  padding: 0 16px;
  line-height: 20px;
  text-decoration: none;
  -webkit-touch-callout: none;
}
.menu a.on { background: var(--ink); color: var(--win); }
.menu [role="separator"] { padding: 4px 0 3px; }
.menu [role="separator"]::after { content: ""; display: block; height: 1px; background: var(--grey); }
.menushield { position: fixed; inset: 0; z-index: 9998; }   /* takes the click that closes a menu */

/* Desktop and icons. The desk is the 50% pattern until the first picture dissolves in over it. */
.desk { position: fixed; inset: var(--bar) 0 0 0; overflow: clip; background: var(--grey); }   /* clip, so focus never scrolls the desk */
.desk.drawn { background: var(--win); }
.picture {
  position: absolute;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  pointer-events: none;
}
.icons {
  position: relative;
  display: flex;
  flex-direction: column;
  flex-wrap: wrap-reverse;
  align-content: flex-start;
  gap: 8px;
  height: 100%;
  margin: 0;
  padding: 16px 12px;
  list-style: none;
}
.icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 104px;
  height: 108px;
  padding: 4px 0;
  border: 0;
  background: none;
  touch-action: manipulation;
}
/* Icon art is 32x32, 1-bit, shown at 64x64. Selected and open icons have their own art. */
.art { position: relative; flex: none; width: 64px; height: 64px; }
.art img { position: absolute; inset: 0; display: none; width: 100%; height: 100%; image-rendering: pixelated; filter: var(--invert); }
.art .base { display: block; }
.icon.selected:not(.open) .base, .icon:focus-visible:not(.open) .base, .icon.open .base { display: none; }
.icon.selected:not(.open) .chosen, .icon:focus-visible:not(.open) .chosen, .icon.open .opened { display: block; }
.icon .label {
  position: relative;
  max-width: 100%;
  margin-top: 4px;
  padding: 0 4px;
  background: var(--win);
  font-family: "Ark Pixel 12", monospace;
  font-size: 12px;
  line-height: 16px;
  text-align: center;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.icon.selected .label, .icon:focus-visible .label { background: var(--ink); color: var(--win); }
/* A short desk, like a laptop's: icons closer together, room for one line of label, so six still
   fit in one column on a 600px desk. */
@media (max-height: 760px) {
  .icons { gap: 4px; padding-block: 12px; }
  .icon { height: 92px; }
}

/* Windows */
.window {
  position: absolute;
  display: flex;
  flex-direction: column;
  width: min(560px, calc(100vw - 24px));
  max-height: calc(100% - 24px);
  background: var(--win);
  border: 1px solid var(--ink);
  box-shadow: 1px 1px 0 var(--ink);
}
/* Six stripes with paper above and below, the title in a gap, and an 11x11 close box. */
.titlebar {
  position: relative;
  display: flex;
  justify-content: center;
  flex: none;
  height: 22px;
  padding: 5px 1px 4px;
  border-bottom: 1px solid var(--ink);
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
  line-height: 12px;
  touch-action: none;
  user-select: none;
}
.window.front .titlebar { background: repeating-linear-gradient(to bottom, var(--ink) 0 1px, var(--win) 1px 2px) content-box; }
.titlebar h2 { position: relative; margin: -2px 0; padding: 0 8px; background: var(--win); font: inherit; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* taller than the stripes, for descenders */
.close {
  position: absolute;
  left: 8px;
  top: 5px;
  width: 11px;
  height: 11px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--win);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--win);
}
.close::after { content: ""; position: absolute; inset: -6px -10px; }
.close svg { display: none; width: 7px; height: 7px; margin: auto; shape-rendering: crispEdges; }
.close:active svg { display: block; }
.close:focus-visible { background: var(--ink); color: var(--win); }
.window:not(.front) .close { visibility: hidden; }
.content { overflow: auto; padding: 12px 16px 16px; overscroll-behavior: contain; }
.window:focus, .content:focus { outline: none; }   /* the striped title bar marks the active window */
.content p { margin: 0 0 12px; }
.content > :last-child { margin-bottom: 0; }
.content a:not(.btn):active, .content a:not(.btn):focus-visible { background: var(--ink); color: var(--win); text-decoration: none; }

/* Project index in the Read Me: the name, the year at the right, and the line about it below in the small face. */
.index { margin: 16px 0 0; padding: 0; list-style: none; border: 1px solid var(--ink); }
.index li + li { border-top: 1px solid var(--ink); }
.index button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 12px;
  width: 100%;
  align-items: baseline;
  padding: 6px 8px 8px;
  border: 0;
  background: none;
  line-height: 20px;
  text-align: left;
}
.index .year, .index .blurb { font-family: "Ark Pixel 12", monospace; font-size: 12px; line-height: 16px; }
.index .blurb { grid-column: 1 / -1; }
.index button:active, .index button:focus-visible { background: var(--ink); color: var(--win); }

/* Get Info: the rows in a box, their labels right-aligned. */
.getinfo { margin: 16px 0 0; border: 1px solid var(--ink); }
.info { display: grid; grid-template-columns: max-content 1fr; align-items: baseline; gap: 0 12px; margin: 0; padding: 8px 12px; line-height: 20px; }
.info dt, .posts { font-family: "Ark Pixel 12 Bold", monospace; font-size: 12px; font-weight: normal; }
.info dt { text-align: right; }
.info dt::after { content: ":"; }
.info dd { margin: 0; }
.posts { margin: 16px 0 0; line-height: 20px; }   /* "Posts on X", labelled like Get Info's rows */
.tweets { margin: 4px 0 0; padding: 0; list-style: none; line-height: 20px; }
.tweets li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
.tweets li + li { margin-top: 4px; }

/* Push buttons: a 1px frame with stepped corners, filled while pressed. */
.buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.btn {
  display: inline-block;
  min-width: 88px;
  padding: 1px 11px;
  border: 1px solid transparent;
  border-image: var(--btn) 6 fill / 6px;
  background: none;
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
  line-height: 20px;
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active, .btn:focus-visible { border-image-source: var(--btn-on); color: var(--win); }
.btn span { position: relative; }
.btn svg { margin-right: 8px; fill: currentColor; shape-rendering: crispEdges; }

/* Scores */
.scores { margin: 4px 0 0; padding: 0; list-style: none; line-height: 20px; }
.scores li { display: grid; grid-template-columns: 200px 1fr 40px; gap: 12px; align-items: center; }
.scores li + li { margin-top: 4px; }
.scores .bar { display: block; height: 12px; border: 1px solid var(--ink); }
.scores .bar span { display: block; height: 100%; background: var(--ink); }
.scores .n { text-align: right; }
.content .updated { margin-top: 12px; }

/* Image composite, and the window it opens */
.composite {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: 100%;
  margin: 4px 0 12px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--ink);
  gap: 1px;

// The nearest icon in an arrow's direction, counting sideways distance double.
function nearest(from, key) {
  const [dx, dy] = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] }[key];
  const centre = b => { const r = b.getBoundingClientRect(); return [r.left + r.width / 2, r.top + r.height / 2]; };
  const [fx, fy] = centre(from);
  let best = null, score = Infinity;
  for (const b of icons.values()) {
    const [x, y] = centre(b);
    const along = (x - fx) * dx + (y - fy) * dy, across = Math.abs(dx ? y - fy : x - fx);
    if (along > 1 && along + 2 * across < score) { best = b; score = along + 2 * across; }
  }
  return best;
}

// Every visit starts with the Read Me open; a window named in the URL opens on top of it, on the
// entry the visit arrived on, so one Back leaves. A reload keeps its place in history and adds no entry.
const start = location.hash.slice(1);
if (history.state) here = history.state.n;
else history.replaceState({ n: 0, id: start || "readme" }, "");
open("readme", null, 0);
open(start, null, here);
</script>
