   stays crisp only at its own size: Ark Pixel 16 at 16px, Ark Pixel 12 and its smeared bold at 12px.
   Line heights stay even, so the glyphs sit on whole pixels. */
@font-face { font-family: "Ark Pixel 16"; src: url("fonts/ArkPixel16-Prop-Latin.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Ark Pixel 12 Bold"; src: url("fonts/ArkPixel12-Smear.woff2") format("woff2"); font-display: block; }
@font-face { font-family: "Ark Pixel 12"; src: url("fonts/ArkPixel12-Prop-Latin.woff2") format("woff2"); font-display: block; }

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #fff;
    --win: #000;
    --invert: invert(1);
    color-scheme: dark;
    --btn: var(--btn-d);
    --btn-on: var(--btn-on-d);
    --sb-up: var(--sb-up-d);
    --sb-up-on: var(--sb-up-on-d);
    --sb-down: var(--sb-down-d);
    --sb-down-on: var(--sb-down-on-d);
  }
}
:root[data-theme="dark"] {
  --ink: #fff;
  --win: #000;
  --invert: invert(1);
  color-scheme: dark;
  --btn: var(--btn-d);
  --btn-on: var(--btn-on-d);
  --sb-up: var(--sb-up-d);
  --sb-up-on: var(--sb-up-on-d);
  --sb-down: var(--sb-down-d);
  --sb-down-on: var(--sb-down-on-d);
}

* { box-sizing: border-box; }
html { --bar: 24px; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; cursor: default; }
html, body { height: 100%; }
body {
  margin: 0;
  overflow: hidden;
  background: var(--win);
  color: var(--ink);
  font-family: "Ark Pixel 16", monospace;
  font-size: 16px;
  line-height: 24px;
  word-spacing: -2px;
  -webkit-font-smoothing: none;
  -webkit-tap-highlight-color: transparent;
}
::selection { background: var(--ink); color: var(--win); }
button { font: inherit; color: inherit; word-spacing: inherit; cursor: inherit; }
a { color: inherit; cursor: inherit; text-decoration-thickness: 1px; text-underline-offset: 2px; }
/* Nothing reacts to hover. Things invert while pressed, and keyboard focus inverts them too. */
:focus-visible { outline: none; }

/* Menu bar */
.menubar {
  position: fixed;
  inset: 0 0 auto 0;
  z-index: 10000;
  display: flex;
  height: var(--bar);
  margin: 0;
  padding: 0 8px;
  list-style: none;
  background: var(--win);
  border-bottom: 1px solid var(--ink);
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
}
.menubar a {
  display: block;
  height: calc(var(--bar) - 1px);
  padding: 0 8px;
  line-height: calc(var(--bar) - 2px);
  text-decoration: none;
  white-space: nowrap;
}
.menubar span { position: relative; }
.menubar .theme { margin-left: auto; }
.menubar button {
  display: grid;
  place-items: center;
  width: 36px;
  height: calc(var(--bar) - 1px);
  padding: 0;
  border: 0;
  background: none;
}
.menubar button svg { display: block; width: 13px; height: 13px; shape-rendering: crispEdges; }
.menubar a:active, .menubar a:focus-visible, .menubar button:active, .menubar button:focus-visible { background: var(--ink); color: var(--win); }

/* Desktop and icons. The desk is the 50% pattern until the first picture dissolves in over it. */
.desk { position: fixed; inset: var(--bar) 0 0 0; overflow: clip; background: var(--grey); }   /* clip, so focus never scrolls the desk */
.desk.drawn { background: var(--win); }
.picture {
  position: absolute;
  left: 0;
  top: 0;
  image-rendering: pixelated;
  pointer-events: none;
}
.about { position: absolute; right: 4px; bottom: 4px; z-index: 1; padding: 7px; }
.about svg { display: block; width: 19px; height: 19px; shape-rendering: crispEdges; }
.about .paper { fill: var(--win); }
.about .ink { fill: var(--ink); }
.about:active .paper, .about:focus-visible .paper { fill: var(--ink); }
.about:active .q, .about:focus-visible .q { fill: var(--win); }
.icons {
  position: relative;
  display: flex;
  flex-direction: column;
  flex-wrap: wrap-reverse;
  align-content: flex-start;
  gap: 8px;
  height: 100%;
  margin: 0;
  padding: 16px 12px 44px;
  list-style: none;
}
.icon {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 104px;
  height: 108px;
  padding: 4px 0;
  border: 0;
  background: none;
  touch-action: manipulation;
}
/* Icon art is 32x32, 1-bit, shown at 64x64. Selected and open icons have their own art. */
.art { position: relative; flex: none; width: 64px; height: 64px; }
.art img { position: absolute; inset: 0; display: none; width: 100%; height: 100%; image-rendering: pixelated; filter: var(--invert); }
.art .base { display: block; }
.icon.selected:not(.open) .base, .icon:focus-visible:not(.open) .base, .icon.open .base { display: none; }
.icon.selected:not(.open) .chosen, .icon:focus-visible:not(.open) .chosen, .icon.open .opened { display: block; }
.icon .label {
  position: relative;
  max-width: 100%;
  margin-top: 4px;
  padding: 0 4px;
  background: var(--win);
  font-family: "Ark Pixel 12", monospace;
  font-size: 12px;
  line-height: 16px;
  text-align: center;
  overflow-wrap: anywhere;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.icon.selected .label, .icon:focus-visible .label { background: var(--ink); color: var(--win); }

/* Windows */
.window {
  position: absolute;
  display: flex;
  flex-direction: column;
  width: min(560px, calc(100vw - 24px));
  max-height: calc(100% - 24px);
  background: var(--win);
  border: 1px solid var(--ink);
  box-shadow: 1px 1px 0 var(--ink);
}
/* Six stripes with paper above and below, the title in a gap, and an 11x11 close box. */
.titlebar {
  position: relative;
  display: flex;
  justify-content: center;
  flex: none;
  height: 22px;
  padding: 5px 1px 4px;
  border-bottom: 1px solid var(--ink);
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
  line-height: 12px;
  touch-action: none;
  user-select: none;
}
.window.front .titlebar { background: repeating-linear-gradient(to bottom, var(--ink) 0 1px, var(--win) 1px 2px) content-box; }
.titlebar h2 { position: relative; margin: -2px 0; padding: 0 8px; background: var(--win); font: inherit; line-height: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }   /* taller than the stripes, for descenders */
.close {
  position: absolute;
  left: 8px;
  top: 5px;
  width: 11px;
  height: 11px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--win);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--win);
}
.close::after { content: ""; position: absolute; inset: -6px -10px; }
.close svg { display: none; width: 7px; height: 7px; margin: auto; shape-rendering: crispEdges; }
.close:active svg { display: block; }
.close:focus-visible { background: var(--ink); color: var(--win); }
.window:not(.front) .close { visibility: hidden; }
.content { overflow: auto; padding: 12px 16px 16px; overscroll-behavior: contain; }
.window:focus, .content:focus { outline: none; }   /* the striped title bar marks the active window */
.content p { margin: 0 0 12px; }
.content > :last-child { margin-bottom: 0; }
.content a:not(.btn):active, .content a:not(.btn):focus-visible { background: var(--ink); color: var(--win); text-decoration: none; }

/* Project index in the Read Me: the name and year in bold, the line about it below. */
.index { margin: 16px 0 0; padding: 0; list-style: none; border: 1px solid var(--ink); }
.index li + li { border-top: 1px solid var(--ink); }
.index button {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0 12px;
  width: 100%;
  padding: 4px 8px;
  border: 0;
  background: none;
  line-height: 20px;
  text-align: left;
}
.index .name, .index .year { font-family: "Ark Pixel 12 Bold", monospace; font-size: 12px; }
.index .blurb { grid-column: 1 / -1; }
.index button:active, .index button:focus-visible { background: var(--ink); color: var(--win); }

/* Get Info: the icon and name, a rule, then the rows with their labels right-aligned. */
.getinfo { margin: 16px 0 0; border: 1px solid var(--ink); }
.getinfo .head { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--ink); font-family: "Ark Pixel 12 Bold", monospace; font-size: 12px; line-height: 16px; }
.getinfo .head img { flex: none; width: 32px; height: 32px; image-rendering: pixelated; filter: var(--invert); }
.info { display: grid; grid-template-columns: max-content 1fr; align-items: baseline; gap: 0 12px; margin: 0; padding: 8px 12px; line-height: 20px; }
.info dt { text-align: right; font-family: "Ark Pixel 12 Bold", monospace; font-size: 12px; }
.info dt::after { content: ":"; }
.info dd { margin: 0; }
.tweets { margin: 16px 0 0; padding: 0; list-style: none; line-height: 20px; }
.tweets li { display: grid; grid-template-columns: 120px 1fr; gap: 12px; }
.tweets li + li { margin-top: 4px; }

/* Push buttons: a 1px frame with stepped corners, filled while pressed. */
.buttons { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.btn {
  display: inline-block;
  min-width: 88px;
  padding: 1px 11px;
  border: 1px solid transparent;
  border-image: var(--btn) 6 fill / 6px;
  font-family: "Ark Pixel 12 Bold", monospace;
  font-size: 12px;
  line-height: 20px;
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
}
.btn:active, .btn:focus-visible { border-image-source: var(--btn-on); color: var(--win); }
.btn span { position: relative; }
.btn svg { margin-right: 8px; fill: currentColor; shape-rendering: crispEdges; }

/* Scores */
.scores { margin: 4px 0 0; padding: 0; list-style: none; line-height: 20px; }
.scores li { display: grid; grid-template-columns: 200px 1fr 40px; gap: 12px; align-items: center; }
.scores li + li { margin-top: 4px; }
.scores .bar { display: block; height: 12px; border: 1px solid var(--ink); }
.scores .bar span { display: block; height: 100%; background: var(--ink); }
.scores .n { text-align: right; }
.content .updated { margin-top: 12px; }

/* Image composite, and the window it opens */
.composite {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: 100%;
  margin: 4px 0 12px;
  padding: 0;
  border: 1px solid var(--ink);
  background: var(--ink);
  gap: 1px;
}
.composite img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; background: #fff; }
.composite:active, .composite:focus-visible { filter: invert(1); }
.window.wide { width: min(880px, calc(100vw - 24px)); }
.pictures { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pictures figure { margin: 0; }
.pictures figure:first-child { grid-column: 1 / -1; }
.pictures img { display: block; width: 100%; height: auto; border: 1px solid var(--ink); }
.pictures figcaption { margin-top: 4px; }

/* Movie player */
.player { margin: 4px 0 12px; border: 1px solid var(--ink); }
.player video { display: block; width: 100%; height: auto; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
.controls { display: flex; align-items: center; gap: 8px; height: 25px; padding: 0 8px 0 0; border-top: 1px solid var(--ink); }
.play { display: grid; place-items: center; width: 32px; height: 24px; padding: 0; border: 0; border-right: 1px solid var(--ink); background: var(--win); }
.play:active, .play:focus-visible { background: var(--ink); color: var(--win); }
.play svg { display: block; width: 10px; height: 10px; shape-rendering: crispEdges; }
.play .i-play { display: none; }
.player.paused .i-play { display: block; }
.player.paused .i-pause { display: none; }
.track { display: flex; align-items: center; flex: 1; align-self: stretch; padding: 0 4px; touch-action: none; }
.track:focus-visible { background: var(--ink); }
.scrub { flex: 1; height: 12px; border: 1px solid var(--ink); pointer-events: none; }
.scrub span { display: block; width: 0; height: 100%; background: var(--ink); }
.track:focus-visible .scrub { border-color: var(--win); }
.track:focus-visible .scrub span { background: var(--win); }

/* Zoom rectangles, and the dotted outline a dragged window leaves behind until it is let go */
.zoomrect { position: fixed; z-index: 9999; border: 1px solid var(--ink); pointer-events: none; }
.dragrect { position: fixed; z-index: 9999; border: 1px dotted #fff; mix-blend-mode: difference; pointer-events: none; }   /* inverts what it crosses */
.shield { position: absolute; }

/* Mac scroll bars inside windows: arrow boxes, a track in the 50% pattern, and a square box that
   rides along it. The front window's alone are drawn; the others are blank. */
@media (min-width: 601px) and (min-height: 501px) {
  .content::-webkit-scrollbar { width: 16px; }
  .content::-webkit-scrollbar-track { border-left: 1px solid var(--ink); background: var(--grey); }
  .content::-webkit-scrollbar-thumb {
    background:
      linear-gradient(to right, var(--ink) 0 1px, transparent 1px) 0 var(--f, 0%) / 16px 16px no-repeat,
      linear-gradient(var(--ink) 0 1px, var(--win) 1px 15px, var(--ink) 15px) 0 var(--f, 0%) / 16px 16px no-repeat;
  }
  .content::-webkit-scrollbar-button { display: none; }
  .content::-webkit-scrollbar-button:vertical:start:decrement, .content::-webkit-scrollbar-button:vertical:end:increment { display: block; height: 16px; }
  .content::-webkit-scrollbar-button:vertical:start:decrement { background: var(--sb-up); }
  .content::-webkit-scrollbar-button:vertical:end:increment { background: var(--sb-down); }
  .content::-webkit-scrollbar-button:vertical:start:decrement:active { background: var(--sb-up-on); }
  .content::-webkit-scrollbar-button:vertical:end:increment:active { background: var(--sb-down-on); }
  .window:not(.front) .content::-webkit-scrollbar-track, .window:not(.front) .content::-webkit-scrollbar-button:vertical:start:decrement, .window:not(.front) .content::-webkit-scrollbar-button:vertical:end:increment { background: linear-gradient(var(--ink) 0 0) 0 0 / 1px 100% no-repeat, var(--win); border: 0; }
  .window:not(.front) .content::-webkit-scrollbar-thumb { background: none; }
}
@supports not selector(::-webkit-scrollbar) {
  .content { scrollbar-color: var(--ink) var(--win); }
}

@media (max-width: 600px), (max-height: 500px) {
  .menubar { padding: 0; }
  .menubar a { padding: 0 8px; }
  .icons {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(88px, 1fr));
    align-content: start;
    gap: 12px 0;
    height: 100%;
    overflow-y: auto;
    padding: 16px 4px;
  }
  .icon { width: auto; min-width: 0; }
  .window, .window.wide { inset: 0 !important; width: auto; max-height: none !important; box-shadow: none; border-width: 0; }
  .titlebar { height: 28px; padding: 8px 1px 7px; }
  .close { top: 8px; }
  .content { flex: 1; padding: 12px max(16px, calc((100% - 640px) / 2)) 16px; }
  .scores li { grid-template-columns: 1fr 40px; gap: 0 12px; }
  .scores li + li { margin-top: 8px; }
  .scores .bar { grid-column: 1 / -1; grid-row: 2; }
}
@media (max-width: 360px) {
  .menubar a { padding: 0 6px; }
  .menubar button { width: 32px; }
}
/* Fingers need bigger targets than a mouse. */
@media (pointer: coarse) {
  html { --bar: 34px; }
  .close::after { inset: -11px -14px; }
  .tweets li + li { margin-top: 0; }
  .tweets li > * { padding: 6px 0; }
  .tweets a { display: block; }
  .menubar a { min-width: 36px; text-align: center; }
  .btn { line-height: 28px; }
  .controls { height: 35px; }
  .play { width: 44px; height: 34px; }
}

<body>

<nav aria-label="Menu bar"><ul class="menubar" id="menubar"></ul></nav>
<main class="desk" id="desk">
  <ul class="icons" id="icons"></ul>
</main>

<script src="projects.js?v=e08ce5527e"></script>
<script>
const desk = document.getElementById("desk");
const iconList = document.getElementById("icons");
const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
const phone = matchMedia("(max-width: 600px), (max-height: 500px)");

const readme = { id: "readme", name: "Read Me", body: SITE.intro, index: PROJECTS, links: SITE.contact, icon: "media/icons/readme.png" };
const items = [readme, ...PROJECTS];
const byId = new Map(items.map(p => [p.id, p]));
// A project's images open in a window of their own, which belongs to the project's window.
for (const p of PROJECTS) if (p.images) byId.set(p.id + "-images", { id: p.id + "-images", name: p.name + " images", pictures: p.images, links: [], wide: true, parent: p.id });
const icons = new Map();
const windows = new Map();
let z = 1;
let cascade = 0;

const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) n.append(k);
  return n;
};
// Pixel fonts blur off whole screen pixels. Centred text, or text in a grid of fractional
// columns, often lands between two, so it is nudged left onto one.
const snap = (n) => {
  n.style.left = "";
  const f = n.getBoundingClientRect().x * devicePixelRatio % 1;
  if (f) n.style.left = -f / devicePixelRatio + "px";
};
const SNAP = ".icon .label, .titlebar h2, .btn span, .menubar span";
Promise.all([...document.fonts].map(f => f.load())).then(() => document.querySelectorAll(SNAP).forEach(snap));
addEventListener("resize", () => document.querySelectorAll(SNAP).forEach(snap));

/* Menu bar */
const menubar = document.getElementById("menubar");
const me = el("a", { className: "me", href: "#readme" }, el("span", { textContent: SITE.name }));
me.addEventListener("click", e => { e.preventDefault(); open("readme", me); });
menubar.append(el("li", {}, me));
const ext = (props, kids) => el("a", { target: "_blank", rel: "noopener", ...props }, kids);
// Button glyphs, drawn in pixels as tall as the button font's capitals.
const glyphs = {
  mail: '<svg width="13" height="9" viewBox="0 0 13 9"><path d="M0 0h13v1H0zM0 1h3v1H0zM10 1h3v1H10zM0 2h2v6H0zM3 2h1v1H3zM9 2h1v1H9zM11 2h2v6H11zM4 3h1v1H4zM8 3h1v1H8zM5 4h1v1H5zM7 4h1v1H7zM6 5h1v1H6zM0 8h13v1H0z"/></svg>',
  x: '<svg width="10" height="9" viewBox="0 0 10 9"><path d="M0 0h2v1H0zM8 0h1v1H8zM1 1h2v1H1zM7 1h1v1H7zM2 2h2v1H2zM6 2h1v1H6zM3 3h3v1H3zM4 4h2v1H4zM3 5h1v1H3zM5 5h2v1H5zM2 6h1v1H2zM6 6h2v1H6zM1 7h1v1H1zM7 7h2v1H7zM0 8h1v1H0zM8 8h2v1H8z"/></svg>',
};
for (const l of SITE.links) menubar.append(el("li", {}, ext({ href: l.href }, el("span", { textContent: l.label }))));

/* Light and dark */
const systemDark = matchMedia("(prefers-color-scheme: dark)");
const isDark = () => (document.documentElement.dataset.theme || (systemDark.matches ? "dark" : "light")) === "dark";
// A circle, half filled: the left half is ink.
const themeBtn = el("button", { type: "button", innerHTML: '<svg viewBox="0 0 13 13"><path d="M4 0h5v1H4zM2 1h2v1H2zM9 1h2v1H9zM1 2h1v2H1zM11 2h1v2h-1zM0 4h1v5H0zM12 4h1v5h-1zM1 9h1v2H1zM11 9h1v2h-1zM2 11h2v1H2zM9 11h2v1H9zM4 12h5v1H4zM6 1h1v11H6zM4 1h2v11H4zM2 2h2v9H2zM1 4h1v5H1z" fill="currentColor"/></svg>' });
const labelTheme = () => {
  const next = isDark() ? "Light mode" : "Dark mode";
  themeBtn.setAttribute("aria-label", next);
  themeBtn.title = next;
};
themeBtn.addEventListener("click", () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("theme", next); } catch {}
  themeChanged();
});
menubar.append(el("li", { className: "theme" }, themeBtn));
labelTheme();

/* Icon art: 32x32, 1-bit, in black on white, with the same name plus -selected and -open for the
   Finder's selected and open icons. Dark mode inverts it in CSS. */
const art = (src, className) => el("img", { src, className, alt: "", width: 32, height: 32 });
function iconArt(item) {
  const span = el("span", { className: "art" }, [
    art(item.icon, "base"), art(item.icon.replace(".png", "-selected.png"), "chosen"), art(item.icon.replace(".png", "-open.png"), "opened"),
  ]);
  span.setAttribute("aria-hidden", "true");
  return span;
}

/* Icons */
for (const item of items) {
  const b = el("button", { className: "icon", type: "button", title: item.name }, [iconArt(item), el("span", { className: "label", textContent: item.label || item.name })]);
  b.dataset.id = item.id;
  b.addEventListener("pointerdown", e => e.stopPropagation());
  b.addEventListener("click", e => {
    // Keyboard (detail 0) and touch open on one activation; a mouse selects, then double-click opens.
    if (e.detail === 0 || b.lastPointer === "touch" || b.lastPointer === "pen") open(item.id, b);
    else select(item.id);
  });
  b.addEventListener("pointerup", e => { b.lastPointer = e.pointerType; });
  b.addEventListener("dblclick", () => open(item.id, b));
  icons.set(item.id, b);
  iconList.append(el("li", {}, b));
}
function select(id) {
  for (const [k, b] of icons) b.classList.toggle("selected", k === id);   // a mouse-only state, so not in ARIA
}
desk.addEventListener("pointerdown", e => { if (e.target === desk || e.target === iconList) select(null); });

/* Zoom rectangles between an icon and a window */
function zoom(from, to, done) {
  if (still) return done();
  const steps = 8;
  let at = 0;
  for (let i = 1; i <= steps; i++) {
    at += 10 + Math.random() * 26;   // uneven frames, like an old machine struggling to keep up
    const t = i / steps;
    const r = {
      left: from.left + (to.left - from.left) * t,
      top: from.top + (to.top - from.top) * t,
      width: from.width + (to.width - from.width) * t,
      height: from.height + (to.height - from.height) * t,
    };
    setTimeout(() => {
      const box = el("div", { className: "zoomrect" });
      Object.assign(box.style, { left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px" });
      document.body.append(box);
      setTimeout(() => box.remove(), 70);
    }, at);
  }
  setTimeout(done, at + 20);
}

/* Window content */
function player(src, poster, name) {
  const video = el("video", { src, poster: poster || "", muted: true, loop: true, playsInline: true, preload: "metadata" });
  video.setAttribute("aria-label", name);
  const fill = el("span");
  const playSvg = '<svg class="i-play" viewBox="0 0 10 10"><path d="M2 0h1v10H2zM3 1h1v8H3zM4 2h1v6H4zM5 3h1v4H5zM6 4h1v2H6z" fill="currentColor"/></svg><svg class="i-pause" viewBox="0 0 10 10"><path d="M1 0h3v10H1zM6 0h3v10H6z" fill="currentColor"/></svg>';
  const btn = el("button", { className: "play", type: "button", innerHTML: playSvg });
  btn.setAttribute("aria-label", "Play");
  const track = el("div", { className: "track", tabIndex: 0 }, el("div", { className: "scrub" }, fill));
  for (const [k, v] of [["role", "slider"], ["aria-label", "Seek"], ["aria-valuemin", "0"], ["aria-valuemax", "100"], ["aria-valuenow", "0"]]) track.setAttribute(k, v);
  const wrap = el("div", { className: "player paused" }, [video, el("div", { className: "controls" }, [btn, track])]);
  const tick = () => {
    const pct = (video.currentTime / video.duration) * 100;
    fill.style.width = pct + "%";
    track.setAttribute("aria-valuenow", Math.round(pct));
    if (!video.paused) requestAnimationFrame(tick);
  };
  video.addEventListener("play", () => { wrap.classList.remove("paused"); btn.setAttribute("aria-label", "Pause"); requestAnimationFrame(tick); });
  video.addEventListener("pause", () => { wrap.classList.add("paused"); btn.setAttribute("aria-label", "Play"); });
  video.addEventListener("seeked", tick);
  wrap.toggle = () => { wrap.userPaused = !video.paused; video.paused ? video.play() : video.pause(); };
  btn.addEventListener("click", wrap.toggle);
  video.addEventListener("click", wrap.toggle);
  // Press anywhere along the bar and drag to scrub. Seeking needs the duration, so it starts with the metadata.
  const seek = (e) => {
    const r = track.firstChild.getBoundingClientRect();
    const t = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
    fill.style.width = t * 100 + "%";
    video.currentTime = t * video.duration;
  };
  video.addEventListener("loadedmetadata", () => {
    track.addEventListener("pointerdown", e => { track.setPointerCapture(e.pointerId); seek(e); });
    track.addEventListener("pointermove", e => { if (track.hasPointerCapture(e.pointerId)) seek(e); });
    track.addEventListener("keydown", e => {
      const to = { ArrowLeft: video.currentTime - 2, ArrowRight: video.currentTime + 2, Home: 0, End: video.duration }[e.key];
      if (to === undefined) return;
      e.preventDefault();
      video.currentTime = Math.min(video.duration, Math.max(0, to));
    });
  }, { once: true });
  // Play only while on screen, and never if the visitor paused it or prefers no motion.
  new IntersectionObserver(([e]) => {
    if (e.isIntersecting && !wrap.userPaused && !still) video.play();
    else video.pause();
  }).observe(video);
  return wrap;
}
// The leaderboard's data file defines FRONTIER. It is loaded once; its runs come sorted by
// model, then effort, so a model's last run is its highest tested effort.
const frontiers = new Map();
const loadFrontier = (src) => frontiers.get(src) || frontiers.set(src, new Promise(r => {
  document.head.append(el("script", { src, onload: () => r(FRONTIER) }));
})).get(src);
function scores(s) {
  const ol = el("ol", { className: "scores" });
  const note = el("p", { className: "updated" });
  loadFrontier(s.source).then((FRONTIER) => {
    const top = new Map();
    for (const r of FRONTIER.runs) top.set(r.model, r);
    const rows = [...top.values()].sort((a, b) => b.accuracy_pct - a.accuracy_pct).slice(0, s.top);
    for (const r of rows) {
      const fill = el("span");
      fill.style.width = r.accuracy_pct + "%";
      ol.append(el("li", {}, [
        el("span", { textContent: r.model + ", " + r.effort }),
        el("span", { className: "bar" }, fill),
        el("span", { className: "n", textContent: r.accuracy_pct + "%" }),
      ]));
    }
    const [y, m, d] = FRONTIER.generated.split("-");
    const updated = new Date(Date.UTC(y, m - 1, d)).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric", timeZone: "UTC" });
    note.append(`Top ${rows.length} of ${top.size} models, each at its highest tested effort. Updated ${updated}. `, ext({ href: s.page, textContent: `See all ${top.size}` }));
  });
  return [ol, note];
}
function content(item) {
  const c = el("div", { className: "content", tabIndex: 0 });   // focusable, so keys scroll it
  // The scroll bar's square box sits as far down its thumb as the window is scrolled, so it runs
  // the whole track like the Mac's, however long the thumb is.
  c.addEventListener("scroll", () => c.style.setProperty("--f", c.scrollTop / (c.scrollHeight - c.clientHeight) * 100 + "%"), { passive: true });
  for (const p of item.body || []) {
    // [text](url) in a paragraph becomes a link.
    const parts = p.split(/\[([^\]]+)\]\(([^)]+)\)/);
    c.append(el("p", {}, parts.map((t, i) => i % 3 === 1 ? ext({ href: parts[i + 1], textContent: t }) : i % 3 === 2 ? "" : t)));
  }
  if (item.index) {
    c.append(el("ul", { className: "index" }, item.index.map(p => {
      const b = el("button", { type: "button" }, [
        el("span", { className: "name", textContent: p.name }),
        el("span", { className: "year", textContent: p.year }),
        el("span", { className: "blurb", textContent: p.blurb }),
      ]);
      b.addEventListener("click", () => open(p.id, b));
      return el("li", {}, b);
    })));
  }
  if (item.video) c.append(player(item.video, item.thumb, item.name));
  if (item.images) {
    const b = el("button", { className: "composite", type: "button" }, item.images.map(i => el("img", { src: i.thumb, alt: i.alt })));
    b.setAttribute("aria-label", "Open " + item.name + " images");
    b.addEventListener("click", () => open(item.id + "-images", b));
    c.append(b);
  }
  if (item.pictures) c.append(el("div", { className: "pictures" }, item.pictures.map(i => el("figure", {}, [el("img", { src: i.src, alt: i.alt }), el("figcaption", { textContent: i.alt })]))));
  if (item.scores) c.append(...scores(item.scores));
  if (item.info) c.append(el("div", { className: "getinfo" }, [
    el("div", { className: "head" }, [el("img", { src: item.icon, alt: "", width: 32, height: 32 }), item.name]),
    el("dl", { className: "info" }, item.info.flatMap(([k, v]) => [el("dt", { textContent: k }), el("dd", { textContent: v })])),
  ]));
  if (item.tweets && item.tweets.length) c.append(el("ul", { className: "tweets" }, item.tweets.map(t => el("li", {}, [el("span", { className: "date", textContent: t.date }), ext({ href: t.href, textContent: t.text })]))));
  if (item.links.length) c.append(el("div", { className: "buttons" }, item.links.map(l => {
    const a = el("a", { className: "btn", href: l.href, ...(l.href.startsWith("mailto:") ? {} : { target: "_blank", rel: "noopener" }) });
    a.append(el("span", { textContent: l.label }));
    if (l.glyph) a.insertAdjacentHTML("afterbegin", glyphs[l.glyph]);
    return a;
  })));
  return c;
}

/* Windows. Opening one adds a history entry ({ n, id }), so Back closes the front window.
   The URL's hash always names the front window. */
let here = 0;       // n of the current history entry
let stepping = 0;   // steps back that close() asked for and the browser hasn't made yet
const frontmost = () => [...windows.values()].sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
const name = w => history.replaceState(history.state, "", w ? "#" + w.dataset.id : location.pathname + location.search);
function front(w) {
  for (const o of windows.values()) o.classList.toggle("front", o === w);
  w.style.zIndex = ++z;
  name(w);
}
// entry is the history entry the window belongs to, when that entry exists already.
function open(id, opener, entry) {
  const item = byId.get(id);
  if (!item) return;
  const icon = icons.get(id);
  if (icon) select(id);
  if (item.parent && !windows.has(item.parent)) open(item.parent, null, entry);
  if (windows.has(id)) { const w = windows.get(id); front(w); w.body.focus(); return; }
  if (entry === undefined) { history.pushState({ n: ++here, id }, ""); entry = here; }

  // The close box is empty, and shows a starburst while pressed.
  const closeBtn = el("button", { className: "close", type: "button", innerHTML:
    '<svg class="burst" viewBox="0 0 7 7"><path d="M0 0h1v1H0zM1 1h1v1H1zM5 5h1v1H5zM6 6h1v1H6zM6 0h1v1H6zM5 1h1v1H5zM1 5h1v1H1zM0 6h1v1H0zM3 0h1v2H3zM3 5h1v2H3zM0 3h2v1H0zM5 3h2v1H5z" fill="currentColor"/></svg>' });
  closeBtn.setAttribute("aria-label", "Close");
  const title = el("div", { className: "titlebar" }, [closeBtn, el("h2", { id: id + "-title", textContent: item.name })]);
  const body = content(item);
  const w = el("section", { className: item.wide ? "window wide" : "window", tabIndex: -1 }, [title, body]);
  w.dataset.id = id;
  w.entry = entry;
  w.body = body;
  w.opener = opener;
  w.origin = icon ? icon.querySelector(".art") : windows.get(item.parent).querySelector(".composite");   // zoom from here
  w.setAttribute("role", "dialog");   // non-modal
  w.setAttribute("aria-labelledby", id + "-title");
  w.style.visibility = "hidden";
  desk.append(w);
  windows.set(id, w);
  icon?.classList.add("open");   // the Finder fills an open item's icon with grey

  // Cascade new windows from the top-left, keeping them on screen.
  place(w, Math.min(24 + cascade * 24, desk.clientWidth - w.offsetWidth - 12), Math.min(16 + cascade * 24, desk.clientHeight - w.offsetHeight - 12));
  cascade = (cascade + 1) % 8;
  front(w);

  w.querySelectorAll(SNAP).forEach(snap);
  zoom(w.origin.getBoundingClientRect(), w.getBoundingClientRect(), () => {
    w.style.visibility = "";
    if (w.classList.contains("front")) w.body.focus();
  });

  w.addEventListener("pointerdown", () => front(w));
  w.addEventListener("focusin", () => front(w));
  closeBtn.addEventListener("pointerdown", e => e.stopPropagation());
  closeBtn.addEventListener("click", () => close(id));
  drag(w, title);
}
function close(id, popped) {
  const w = windows.get(id);
  if (!w) return;
  const icon = icons.get(id);
  const from = w.getBoundingClientRect();
  const back = w.origin.isConnected ? w.origin.getBoundingClientRect() : from;
  // Focus goes back to what opened the window if it is still in view and not covered.
  const c = w.opener && w.opener.isConnected && w.opener.getBoundingClientRect();
  const hit = c && document.elementsFromPoint(c.left + c.width / 2, c.top + c.height / 2).find(n => !w.contains(n));
  const opener = hit && w.opener.contains(hit) && w.opener;
  for (const v of w.querySelectorAll("video")) v.pause();
  windows.delete(id);
  w.inert = true;
  // Until it is gone, a shield over the closing window swallows taps, so a fast double tap
  // can't reach the window or icon underneath. The wipe's clip-path would let them through.
  const shield = el("div", { className: "shield" });
  Object.assign(shield.style, { left: w.offsetLeft + "px", top: w.offsetTop + "px", width: w.offsetWidth + "px", height: w.offsetHeight + "px" });
  shield.addEventListener("mousedown", e => e.preventDefault());   // and keeps focus where close() puts it
  desk.append(shield);
  // Flicker inverted twice, get repainted away in a few jerky bands, then zoom back to the icon.
  const frames = still ? [] : [
    () => w.style.filter = "invert(1)", () => w.style.filter = "", () => w.style.filter = "invert(1)", () => w.style.filter = "",
    () => w.style.clipPath = "inset(30% 0 0 0)", () => w.style.clipPath = "inset(55% 0 0 0)", () => w.style.clipPath = "inset(85% 0 0 0)",
  ];
  let at = 0;
  for (const f of frames) { at += 25 + Math.random() * 40; setTimeout(f, at); }
  setTimeout(() => {
    w.remove();
    shield.remove();
    for (const v of w.querySelectorAll("video")) { v.removeAttribute("src"); v.load(); }   // stop downloading
    zoom(from, back, () => { if (!windows.has(id)) icon?.classList.remove("open"); });
  }, at + 30);
  const next = frontmost();
  if (next) front(next);
  else { name(null); cascade = 0; }
  // Closing the window the current entry opened steps back, so Back and Forward stay in step.
  if (!popped && w.entry === here && here > 0) { here--; stepping++; history.back(); }
  (opener || (next ? next.body : icon))?.focus();   // this can bring a window to the front, so it goes first
  w.style.zIndex = shield.style.zIndex = ++z;   // stay on top while it flickers out
}
// Keep a window's close box and at least 120px of its title bar on the desk, below the menu bar,
// on whole pixels. Its height is capped from its top, so its bottom stays on the desk and content
// that loads later scrolls instead of running off.
const clamp = (left, top) => [Math.round(Math.max(0, Math.min(left, desk.clientWidth - 120))), Math.round(Math.max(0, Math.min(top, desk.clientHeight - 120)))];
function place(w, left, top) {
  [left, top] = clamp(left, top);
  w.style.left = left + "px";
  w.style.top = top + "px";
  w.style.maxHeight = desk.clientHeight - top - 12 + "px";
}
new ResizeObserver(() => { for (const w of windows.values()) place(w, parseFloat(w.style.left), parseFloat(w.style.top)); }).observe(desk);
// Dragging a title bar moves a dotted outline of the window, and the window jumps there when it
// is let go, as on the Mac, which couldn't redraw a window while it moved.
function drag(w, handle) {
  let sx, sy, ox, oy, outline;
  const to = e => clamp(ox + e.clientX - sx, oy + e.clientY - sy);
  const move = ([x, y]) => { outline.style.left = desk.offsetLeft + x + "px"; outline.style.top = desk.offsetTop + y + "px"; };
  handle.addEventListener("pointerdown", e => {
    if (phone.matches || e.button !== 0) return;
    sx = e.clientX; sy = e.clientY; ox = w.offsetLeft; oy = w.offsetTop;
    handle.setPointerCapture(e.pointerId);
    outline = el("div", { className: "dragrect" });
    Object.assign(outline.style, { width: w.offsetWidth + "px", height: w.offsetHeight + "px" });
    move([ox, oy]);
    document.body.append(outline);
  });
  handle.addEventListener("pointermove", e => { if (handle.hasPointerCapture(e.pointerId)) move(to(e)); });
  handle.addEventListener("pointerup", e => { if (handle.hasPointerCapture(e.pointerId)) place(w, ...to(e)); });
  handle.addEventListener("lostpointercapture", () => outline.remove());
}

// Space plays or pauses the video in the front window, unless a button or link has focus.
document.addEventListener("keydown", e => {
  if (e.key !== " " || e.target.closest("button, a, input, textarea")) return;
  const player = document.querySelector(".window.front .player");
  if (!player) return;
  e.preventDefault();
  player.toggle();
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  const w = frontmost();
  if (w) close(w.dataset.id);
});
addEventListener("popstate", () => {
  const s = history.state;
  if (stepping) stepping--;
  else if (!s) {   // a #hash typed into the address bar, or a link to one, made a new entry
    const id = location.hash.slice(1);
    // An entry that opens no window shares the number of the one before, so Back skips it.
    history.replaceState({ n: byId.has(id) && !windows.has(id) ? ++here : here, id }, "");
    open(id, null, here);
  } else if (s.n < here) {   // Back
    for (; here > s.n; here--) { const w = frontmost(); if (w) close(w.dataset.id, true); }
  } else if (s.n > here) {   // Forward
    here = s.n;
    open(s.id, null, here);
  }
  name(frontmost());
});
// Every visit starts with the Read Me open; a window named in the URL opens on top of it.
// A reload keeps its place in history and adds no entry.
const start = location.hash.slice(1);
if (history.state) here = history.state.n;
else history.replaceState({ n: 0, id: "readme" }, "");
open("readme", null, here);
open(start, null, here || undefined);

/* Desktop picture: a random picture, dithered to the desk's own pixels. Every one to three
   minutes, at random, another one slowly dissolves in. */
const HOLD = [60000, 180000]; // ms a picture stays, picked at random between these
const STEPS = 48;             // dissolve steps
const STEP_MS = 100;          // ms per dissolve step
const DEPTH = 0.5;    // darkest tone, as a share of pixels inked; keeps the picture behind the windows
const picture = el("canvas", { className: "picture" });
picture.setAttribute("aria-hidden", "true");   // the ? names it
desk.prepend(picture);
const pctx = picture.getContext("2d");
const sources = new Map();
const load = p => sources.get(p) || sources.set(p, new Promise(r => { const i = new Image(); i.onload = () => r(i); i.src = p.src; })).get(p);
let W, H, K, frame, px32, order, starts, gen = 0, timer;
const pick = (not) => { const n = Math.floor(Math.random() * (SITE.pictures.length - 1)); return n >= not ? n + 1 : n; };
let shown = Math.floor(Math.random() * SITE.pictures.length);   // the picture on the desk, or dissolving in
let onDesk = -1;    // the picture a dissolve starts from; -1 while the desk is the 50% pattern

// The ? in the corner names the picture and opens its source page.
// A circle with a ? in it, and a ring of paper around it so it stands apart from the picture.
const about = ext({ className: "about", innerHTML: '<svg viewBox="0 0 19 19"><path class="paper" d="M7 0h5v1H7zM5 1h9v1H5zM3 2h13v1H3zM2 3h15v2H2zM1 5h17v2H1zM0 7h19v5H0zM1 12h17v2H1zM2 14h15v2H2zM3 16h13v1H3zM5 17h9v1H5zM7 18h5v1H7z"/><path class="ink" d="M7 1h5v1H7zM5 2h2v1H5zM12 2h2v1H12zM4 3h1v1H4zM14 3h1v1H14zM3 4h1v1H3zM15 4h1v1H15zM2 5h1v2H2zM16 5h1v2H16zM1 7h1v5H1zM17 7h1v5H17zM2 12h1v2H2zM16 12h1v2H16zM3 14h1v1H3zM15 14h1v1H15zM4 15h1v1H4zM14 15h1v1H14zM5 16h2v1H5zM12 16h2v1H12zM7 17h5v1H7z"/><path class="ink q" d="M8 5h4v1H8zM7 6h2v1H7zM11 6h2v3H11zM10 9h2v1H10zM9 10h2v2H9zM9 13h2v1H9z"/></svg>' });
desk.append(about);
function label(p) {
  about.href = p.page;
  about.title = p.title;
  about.setAttribute("aria-label", "About the desktop picture: " + p.title);
}

// The canvas has one pixel per dot, and CSS scales it up without smoothing. Each dot is a whole
// number of screen pixels, K, so a display scaled by 1.25 or 1.5 shows even dots with no moiré.
function size() {
  const dpr = devicePixelRatio;
  K = Math.max(1, Math.round(dpr));
  document.documentElement.style.setProperty("--dot", K / dpr + "px");   // the 50% pattern in CSS uses the same dots
  W = picture.width = Math.ceil(Math.round(desk.clientWidth * dpr) / K);
  H = picture.height = Math.ceil(Math.round(desk.clientHeight * dpr) / K);
  picture.style.width = W * K / dpr + "px";
  picture.style.height = H * K / dpr + "px";
  frame = pctx.createImageData(W, H);
  px32 = new Uint32Array(frame.data.buffer);
  // Each dot gets a random rank from 0 to 255, and the dissolve takes them in rank order.
  // order lists the dots sorted by rank; rank r's dots are order[starts[r]] up to order[starts[r + 1]].
  const rank = new Uint8Array(W * H);
  for (let i = 0; i < rank.length; i += 65536) crypto.getRandomValues(rank.subarray(i, i + 65536));
  starts = new Uint32Array(257);
  for (const r of rank) starts[r + 1]++;
  for (let r = 1; r <= 256; r++) starts[r] += starts[r - 1];
  const at = starts.slice(0, 256);
  order = new Uint32Array(W * H);
  for (let i = 0; i < rank.length; i++) order[at[rank[i]]++] = i;
}
// Ink is opaque white in dark mode and opaque black in light mode, as ABGR on little-endian.
const ink = () => isDark() ? 0xffffffff : 0xff000000;
// 8x8 Bayer thresholds for the ordered dither.
const BAYER = [0,32,8,40,2,34,10,42,48,16,56,24,50,18,58,26,12,44,4,36,14,46,6,38,60,28,52,20,62,30,54,22,3,35,11,43,1,33,9,41,51,19,59,27,49,17,57,25,15,47,7,39,13,45,5,37,63,31,55,23,61,29,53,21].map(v => (v + 0.5) / 64);
// The picture as 1-bit ink: a drawing with an ordered dither, a photo with Floyd-Steinberg.
// p.marks says whether the dots draw the picture's dark or light parts.
function dither(img, p) {
  const [fx, fy] = p.position;
  const c = el("canvas", { width: W, height: H });
  const ctx = c.getContext("2d", { willReadFrequently: true });
  // A photo covers the desk. A drawing is fitted whole, with a margin, on white paper.
  const s = p.kind === "photo" ? Math.max(W / img.width, H / img.height) : Math.min(W / img.width, H / img.height) * 0.9;
  ctx.fillStyle = "#fff";
  ctx.fillRect(0, 0, W, H);
  ctx.drawImage(img, (W - img.width * s) * fx, (H - img.height * s) * fy, img.width * s, img.height * s);
  const d = ctx.getImageData(0, 0, W, H).data;
  const lightInk = p.marks === "light" || (p.marks === "theme" && isDark());
  const e = new Float32Array(W * H);
  for (let i = 0; i < W * H; i++) e[i] = (lightInk ? d[i * 4] : 255 - d[i * 4]) / 255 * DEPTH;
  const out = new Uint8Array(W * H);
  if (p.kind === "drawing") {
    for (let i = 0; i < W * H; i++) out[i] = e[i] > BAYER[((i / W | 0) % 8) * 8 + (i % W) % 8] ? 1 : 0;
    return out;
  }
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const i = y * W + x;
    const on = e[i] > 0.5 ? 1 : 0;
    const err = e[i] - on;
    out[i] = on;
    if (x + 1 < W) e[i + 1] += err * 7 / 16;
    if (y + 1 < H) {
      if (x > 0) e[i + W - 1] += err * 3 / 16;
      e[i + W] += err * 5 / 16;
      if (x + 1 < W) e[i + W + 1] += err / 16;
    }
  }
  return out;
}
// Dots ranked from lo up to hi take the next picture's dots.
function paint(next, lo, hi) {
  const on = ink();
  for (let k = starts[lo]; k < starts[hi]; k++) { const i = order[k]; px32[i] = next[i] ? on : 0; }
  pctx.putImageData(frame, 0, 0);
}
async function show(n, dissolve) {
  const g = ++gen;
  clearTimeout(timer);
  shown = n;
  const p = SITE.pictures[n];
  label(p);
  const img = await load(p);
  if (g !== gen) return;
  const next = dither(img, p);
  if (dissolve) {
    for (let k = 1; k <= STEPS; k++) {
      await new Promise(r => setTimeout(r, STEP_MS));
      if (g !== gen) return;
      paint(next, Math.ceil((k - 1) * 256 / STEPS), Math.ceil(k * 256 / STEPS));
    }
  } else paint(next, 0, 256);
  onDesk = n;
  if (still) return;
  timer = setTimeout(advance, HOLD[0] + Math.random() * (HOLD[1] - HOLD[0]));
}
function advance() {
  if (document.hidden) return document.addEventListener("visibilitychange", advance, { once: true });
  show(pick(shown), true);
}
// Until the first picture has loaded, the desk is the 50% pattern; then the picture dissolves in over it.
function redraw() {
  size();
  if (onDesk >= 0) return show(shown, false);
  const on = ink();
  for (let i = 0; i < px32.length; i++) px32[i] = (i % W + (i / W | 0)) % 2 ? on : 0;
  pctx.putImageData(frame, 0, 0);
  desk.classList.add("drawn");
  show(shown, !still);
}
// The desk draws once it has a size, and again after it is resized.
let resizing;
new ResizeObserver(() => {
  clearTimeout(resizing);
  if (desk.clientWidth && desk.clientHeight) resizing = setTimeout(redraw, W ? 150 : 0);
}).observe(desk);
// Only a "theme" picture's dots change with the theme. Otherwise just the ink does, and a dissolve carries on.
function themeChanged() {
  labelTheme();
  if (SITE.pictures[shown].marks === "theme" || SITE.pictures[onDesk]?.marks === "theme") return show(shown, false);
  const on = ink();
  for (let i = 0; i < px32.length; i++) if (px32[i]) px32[i] = on;
  pctx.putImageData(frame, 0, 0);
}
systemDark.addEventListener("change", themeChanged);
</script>
